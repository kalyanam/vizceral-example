server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/<region>/<node>) fall back to the SPA entry point.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
